<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Segundo Cérebro</title>
  <link rel="stylesheet" href="estilo.css" />
</head>
<body>
  <div id="app">
    <aside id="lateral">
      <div class="lateral-topo">
        <button id="btn-novo" class="icone-botao" title="Novo (Ctrl+N cria uma nota)" data-icone="mais"></button>
        <button id="btn-busca" class="icone-botao" title="Buscar (Ctrl+K)" data-icone="busca"></button>
        <button id="btn-grafo" class="icone-botao" title="Grafo (Ctrl+G)" data-icone="grafo"></button>
      </div>
      <div id="arvore"></div>
    </aside>

    <main>
      <section id="vista-vazia" class="vista"></section>

      <section id="vista-editor" class="vista" hidden>
        <div class="editor-topo">
          <span id="editor-caminho"></span>
          <div class="acoes-topo">
            <button id="editor-modo" title="Alternar entre escrever e ler (Ctrl+E)">Ler</button>
            <button id="editor-mais" class="icone-botao" title="Mais opções" data-icone="mais"></button>
          </div>
        </div>
        <div class="editor-corpo">
          <div class="editor-pagina">
            <input type="text" id="editor-titulo" placeholder="Sem título" />
            <div class="editor-props">
              <select id="editor-tipo">
                <option value="ideia">Ideia</option>
                <option value="tarefa">Tarefa</option>
                <option value="referencia">Referência</option>
              </select>
              <input type="text" id="editor-projeto" list="projetos-lista" placeholder="Projeto" maxlength="40" />
              <input type="date" id="editor-prazo" title="Prazo" />
              <label id="editor-concluida-rotulo"><input type="checkbox" id="editor-concluida" /> Concluída</label>
            </div>
            <textarea id="editor-texto" placeholder="Escreva aqui. [[ liga a outra nota, #tag cria uma tag, - [ ] cria uma tarefa."></textarea>
            <div id="editor-leitura" hidden></div>
            <div id="editor-backlinks" hidden></div>
          </div>
        </div>
        <div class="editor-rodape">
          <span id="editor-contagem"></span>
          <span id="editor-estado"></span>
        </div>
      </section>

      <section id="vista-grafo" class="vista" hidden>
        <svg id="grafo-svg">
          <g id="grafo-camera">
            <g id="grafo-arestas"></g>
            <g id="grafo-nos"></g>
          </g>
        </svg>
        <div class="grafo-barra">
          <span class="escopo" id="grafo-escopo"></span>
          <button id="grafo-tudo" hidden>Ver tudo</button>
          <button id="grafo-zoom-menos" title="Diminuir">−</button>
          <button id="grafo-zoom-mais" title="Aumentar">+</button>
          <button id="grafo-ajustar" title="Enquadrar todas as notas">Ajustar</button>
          <label><input type="checkbox" id="grafo-nomes" checked /> Nomes</label>
          <label><input type="checkbox" id="grafo-orfas" /> Ocultar sem conexões</label>
          <label>Cor
            <select id="grafo-cor">
              <option value="tipo">Tipo</option>
              <option value="projeto">Projeto</option>
            </select>
          </label>
        </div>
        <div class="grafo-legenda" id="grafo-legenda"></div>
        <div class="grafo-info" id="grafo-info"></div>
      </section>

      <section id="vista-quadro" class="vista" hidden>
        <div id="quadro-area">
          <div id="quadro-mundo">
            <svg id="quadro-conexoes">
              <defs>
                <marker id="quadro-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                  <path d="M0 0L10 5L0 10z" />
                </marker>
                <marker id="quadro-seta-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                  <path d="M0 0L10 5L0 10z" />
                </marker>
              </defs>
              <g id="quadro-linhas"></g>
            </svg>
            <div id="quadro-cartoes"></div>
          </div>
        </div>

        <div class="quadro-titulo" id="quadro-titulo"></div>

        <div class="quadro-ferramentas">
          <button id="quadro-postit" title="Novo post-it (N)" data-icone="postit"></button>
          <button id="quadro-nota" title="Adicionar uma nota existente" data-icone="nota"></button>
          <button id="quadro-conectar" title="Conectar cartões (C)" data-icone="elo"></button>
          <button id="quadro-organizar" title="Organizar em grade (G)" data-icone="organizar"></button>
          <button id="quadro-apagar" title="Apagar o selecionado (Delete)" data-icone="lixo"></button>
          <div class="separador"></div>
          <div id="quadro-paleta" class="paleta"></div>
          <div class="separador"></div>
          <button id="quadro-zoom-mais" title="Aumentar">+</button>
          <button id="quadro-zoom-menos" title="Diminuir">−</button>
          <button id="quadro-ajustar" title="Enquadrar tudo" data-icone="ajustar"></button>
        </div>

        <div class="quadro-dica" id="quadro-dica"></div>

        <div class="modal" id="quadro-seletor" hidden>
          <div class="modal-caixa">
            <input type="search" id="quadro-seletor-busca" placeholder="Buscar uma nota para colocar no quadro" />
            <ul id="quadro-seletor-lista"></ul>
          </div>
        </div>
      </section>
    </main>
  </div>

  <ul id="editor-sugestoes" class="sugestoes" hidden></ul>

  <div class="modal global" id="paleta" hidden>
    <div class="modal-caixa">
      <input type="search" id="paleta-busca" placeholder="Buscar notas e quadros" />
      <ul id="paleta-lista"></ul>
    </div>
  </div>

  <datalist id="projetos-lista"></datalist>

  <script src="icones.js"></script>
  <script src="menu-contexto.js"></script>
  <script src="links.js"></script>
  <script src="markdown.js"></script>
  <script src="grafo.js"></script>
  <script src="quadro.js"></script>
  <script src="editor.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
