<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Segundo Cérebro</title>
  <link rel="stylesheet" href="estilo.css" />
</head>
<body>
  <div id="app">
    <aside id="lateral">
      <div class="marca">🧠 <span>Segundo Cérebro</span></div>
      <div id="abas">
        <button class="aba ativo" data-vista="lista" title="Notas (Ctrl+1)">📝 Notas</button>
        <button class="aba" data-vista="grafo" title="Grafo (Ctrl+2)">🕸️ Grafo</button>
      </div>
      <div class="arvore-topo">
        <span>EXPLORADOR</span>
        <span class="topo-botoes">
          <button id="nova-pasta" title="Nova pasta na raiz">📁＋</button>
          <button id="novo-quadro" title="Novo quadro (na pasta selecionada)">🧩＋</button>
        </span>
      </div>
      <div id="arvore"></div>
    </aside>

    <main>
      <section id="vista-lista" class="vista">
        <div class="conteudo-lista">
          <div id="migalhas"></div>
          <div id="subpastas"></div>

          <section class="captura">
            <p id="destino-captura"></p>
            <textarea id="texto" placeholder="A primeira linha é o título. Use #tags e [[links]] para outras notas."></textarea>
            <div class="linha-captura">
              <select id="tipo">
                <option value="tarefa">Tarefa</option>
                <option value="ideia">Ideia</option>
                <option value="referencia">Referência</option>
              </select>
              <input type="text" id="projeto" list="projetos-lista" placeholder="Projeto (opcional)" maxlength="40" />
              <datalist id="projetos-lista"></datalist>
              <input type="date" id="prazo" title="Prazo (só para tarefas)" />
              <button id="salvar" class="primario">Salvar</button>
            </div>
          </section>

          <div class="linha-busca">
            <input type="search" id="busca" placeholder="Buscar nas notas..." />
            <select id="filtro-projeto">
              <option value="">Todos os projetos</option>
            </select>
            <select id="filtro">
              <option value="todas">Todas</option>
              <option value="pendentes">Pendentes</option>
              <option value="atrasadas">Atrasadas</option>
              <option value="concluidas">Concluídas</option>
            </select>
            <label id="rotulo-sub" hidden><input type="checkbox" id="incluir-sub" checked /> Incluir subpastas</label>
          </div>
          <p id="vazio" hidden></p>
          <ul id="lista"></ul>
        </div>
      </section>

      <section id="vista-grafo" class="vista" hidden>
        <svg id="grafo-svg">
          <g id="grafo-camera">
            <g id="grafo-arestas"></g>
            <g id="grafo-nos"></g>
          </g>
        </svg>
        <div class="grafo-barra">
          <span class="escopo" id="grafo-escopo"></span>
          <button id="grafo-zoom-menos" title="Diminuir">−</button>
          <button id="grafo-zoom-mais" title="Aumentar">+</button>
          <button id="grafo-ajustar" title="Enquadrar todas as notas">Ajustar</button>
          <label><input type="checkbox" id="grafo-nomes" checked /> Nomes</label>
          <label><input type="checkbox" id="grafo-orfas" /> Ocultar sem conexões</label>
          <label>Cor:
            <select id="grafo-cor">
              <option value="tipo">Tipo</option>
              <option value="projeto">Projeto</option>
            </select>
          </label>
        </div>
        <div class="grafo-legenda" id="grafo-legenda"></div>
        <div class="grafo-info" id="grafo-info"></div>
      </section>

      <section id="vista-quadro" class="vista" hidden>
        <div id="quadro-area">
          <div id="quadro-mundo">
            <svg id="quadro-conexoes">
              <defs>
                <marker id="quadro-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                  <path d="M0 0L10 5L0 10z" />
                </marker>
                <marker id="quadro-seta-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                  <path d="M0 0L10 5L0 10z" />
                </marker>
              </defs>
              <g id="quadro-linhas"></g>
            </svg>
            <div id="quadro-cartoes"></div>
          </div>
        </div>

        <div class="quadro-titulo" id="quadro-titulo"></div>

        <div class="quadro-ferramentas">
          <button id="quadro-postit" title="Novo post-it (N)">🟨</button>
          <button id="quadro-nota" title="Adicionar uma nota existente">📝</button>
          <button id="quadro-conectar" title="Conectar cartões (C)">🔗</button>
          <button id="quadro-apagar" title="Apagar o selecionado (Delete)">🗑</button>
          <div class="separador"></div>
          <div id="quadro-paleta" class="paleta"></div>
          <div class="separador"></div>
          <button id="quadro-zoom-mais" title="Aumentar">+</button>
          <button id="quadro-zoom-menos" title="Diminuir">−</button>
          <button id="quadro-ajustar" title="Enquadrar tudo">⤢</button>
        </div>

        <div class="quadro-dica" id="quadro-dica"></div>

        <div class="modal" id="quadro-seletor" hidden>
          <div class="modal-caixa">
            <input type="search" id="quadro-seletor-busca" placeholder="Buscar uma nota para colocar no quadro..." />
            <ul id="quadro-seletor-lista"></ul>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="links.js"></script>
  <script src="grafo.js"></script>
  <script src="quadro.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
