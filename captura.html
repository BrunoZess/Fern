<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Captura rápida</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; box-sizing: border-box; height: 100vh; background: #fff; border: 1px solid #ccc; }
    textarea { width: 100%; height: 110px; padding: 8px; font-size: 15px; box-sizing: border-box; }
    .barra { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    select { padding: 6px 10px; font-size: 14px; }
    small { color: #888; }
  </style>
</head>
<body>
  <textarea id="texto" placeholder="Capture algo... (#tags funcionam aqui também)" autofocus></textarea>
  <div class="barra">
    <select id="tipo">
      <option value="tarefa">Tarefa</option>
      <option value="ideia">Ideia</option>
      <option value="referencia">Referência</option>
      <option value="lista">Lista (1ª linha = nome, demais = itens)</option>
    </select>
    <small>Enter salva · Shift+Enter nova linha · Esc fecha</small>
  </div>

  <script src="captura.js"></script>
</body>
</html>
